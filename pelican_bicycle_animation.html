<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鹈鹕骑自行车 · SVG 动画</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18324a;
      --muted: #587187;
      --coral: #f37f61;
      --sun: #ffd879;
      --sea: #8bd4df;
      --road: #334b63;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      font-family: "Avenir Next", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 10%, #fff9dc 0 9%, transparent 30%),
        linear-gradient(145deg, #e9fbf7 0%, #d9eff9 50%, #c8e4f1 100%);
    }

    .card {
      width: min(1080px, 100%);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.75);
      border-radius: 28px;
      background: rgba(255,255,255,.58);
      box-shadow: 0 24px 70px rgba(39, 79, 106, .18);
      backdrop-filter: blur(12px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 22px 28px 16px;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--coral);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 40px);
      letter-spacing: -.04em;
    }

    .hint {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 17px;
      color: #fff;
      background: var(--ink);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(24,50,74,.2);
      transition: transform .2s ease, background .2s ease;
    }

    button:hover { transform: translateY(-2px); background: #254c6b; }
    button:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }

    .stage { padding: 0 18px 18px; }
    svg { display: block; width: 100%; height: auto; border-radius: 22px; }

    .scene * { transform-box: fill-box; transform-origin: center; }
    .motion { animation-play-state: running; }
    .paused .motion, .paused .motion * { animation-play-state: paused !important; }

    .cloud { animation: drift 16s linear infinite; }
    .cloud.cloud-two { animation-name: driftTwo; animation-duration: 22s; animation-delay: -7s; }
    .sun { animation: sunPulse 4s ease-in-out infinite; transform-origin: 78% 21%; }
    .ride { animation: bodyBob 0.72s ease-in-out infinite; }
    .wheel { animation: wheelSpin 1.1s linear infinite; }
    .crank { animation: crankSpin 0.72s linear infinite; }
    .leg-front { animation: legForward .72s ease-in-out infinite; }
    .leg-back { animation: legBack .72s ease-in-out infinite; }
    .wing { animation: wingFloat 1.2s ease-in-out infinite; }
    .head { animation: headNod .72s ease-in-out infinite; }
    .water-line { animation: waterSlide 4s linear infinite; }
    .road-line { animation: roadSlide 1.1s linear infinite; }
    .spark { animation: sparkle 2.4s ease-in-out infinite; }
    .spark:nth-child(2) { animation-delay: .7s; }
    .spark:nth-child(3) { animation-delay: 1.35s; }

    @keyframes drift {
      from { transform: translateX(-80px); }
      to { transform: translateX(160px); }
    }
    @keyframes driftTwo {
      from { transform: translate(550px, 60px) scale(.72); }
      to { transform: translate(790px, 60px) scale(.72); }
    }
    @keyframes sunPulse {
      0%, 100% { transform: scale(1); opacity: .9; }
      50% { transform: scale(1.06); opacity: 1; }
    }
    @keyframes bodyBob {
      0%, 100% { transform: translateY(0) rotate(-.4deg); }
      50% { transform: translateY(-7px) rotate(.5deg); }
    }
    @keyframes wheelSpin { to { transform: rotate(360deg); } }
    @keyframes crankSpin { to { transform: rotate(360deg); } }
    @keyframes legForward {
      0%, 100% { transform: rotate(30deg); }
      50% { transform: rotate(-32deg); }
    }
    @keyframes legBack {
      0%, 100% { transform: rotate(-34deg); }
      50% { transform: rotate(27deg); }
    }
    @keyframes wingFloat {
      0%, 100% { transform: rotate(1deg); }
      50% { transform: rotate(-8deg) translateY(-2px); }
    }
    @keyframes headNod {
      0%, 100% { transform: rotate(-1deg); }
      50% { transform: rotate(2deg); }
    }
    @keyframes waterSlide {
      from { transform: translateX(0); }
      to { transform: translateX(-180px); }
    }
    @keyframes roadSlide {
      from { transform: translateX(0); }
      to { transform: translateX(-180px); }
    }
    @keyframes sparkle {
      0%, 100% { opacity: .18; transform: scale(.8); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      align-items: center;
      padding: 0 28px 24px;
      color: var(--muted);
      font-size: 13px;
    }

    .legend span { display: inline-flex; align-items: center; gap: 7px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .dot.orange { background: var(--coral); }
    .dot.blue { background: #5ea4d8; }
    .dot.yellow { background: var(--sun); }

    @media (max-width: 620px) {
      body { padding: 12px; }
      .topbar { padding: 18px 18px 12px; align-items: flex-start; }
      .stage { padding: 0 10px 10px; }
      .legend { padding: 0 18px 18px; }
      button { padding: 8px 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .motion, .motion * { animation-play-state: paused !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="topbar">
      <div>
        <p class="eyebrow">SVG motion study</p>
        <h1>鹈鹕骑自行车</h1>
        <p class="hint">一只海风里的小骑手，沿着海边慢慢出发。</p>
      </div>
      <button id="toggle" type="button" aria-pressed="false">暂停动画</button>
    </header>

    <section class="stage" aria-label="鹈鹕骑自行车 SVG 动画">
      <svg class="scene motion" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
        <title id="title">鹈鹕骑自行车的动画插画</title>
        <desc id="desc">一只戴着黄色帽子的鹈鹕骑着蓝色自行车，海浪、云朵和道路都在缓慢移动。</desc>
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#b9e8f5" />
            <stop offset="1" stop-color="#edf9f2" />
          </linearGradient>
          <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#78c8dc" />
            <stop offset="1" stop-color="#4fa5c2" />
          </linearGradient>
          <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#405b70" />
            <stop offset="1" stop-color="#263d54" />
          </linearGradient>
          <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
            <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#2d6078" flood-opacity=".2" />
          </filter>
          <clipPath id="roadClip"><rect x="0" y="480" width="1000" height="170" rx="0" /></clipPath>
        </defs>

        <rect width="1000" height="650" fill="url(#sky)" />
        <circle class="sun motion" cx="785" cy="135" r="72" fill="#ffe49a" opacity=".9" />
        <circle cx="785" cy="135" r="98" fill="none" stroke="#ffe9b6" stroke-width="8" opacity=".35" />

        <g class="cloud cloud-one motion" fill="#fff" opacity=".82">
          <path d="M90 160c0-22 18-40 40-40 9 0 18 3 25 9 8-26 33-45 63-45 36 0 65 27 68 62 8-4 17-6 26-6 28 0 51 23 51 51H90c0-5 0-11 0-16Z" />
        </g>
        <g class="cloud cloud-two motion" fill="#fff" opacity=".62">
          <path d="M90 160c0-22 18-40 40-40 9 0 18 3 25 9 8-26 33-45 63-45 36 0 65 27 68 62 8-4 17-6 26-6 28 0 51 23 51 51H90c0-5 0-11 0-16Z" />
        </g>

        <path d="M0 340 C130 300 215 355 345 325 S570 300 705 340 870 375 1000 320 V500 H0Z" fill="url(#sea)" />
        <g class="water-line motion" fill="none" stroke="#c3f2f2" stroke-width="6" stroke-linecap="round" opacity=".7">
          <path d="M-100 386 q45-24 90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0" />
          <path d="M-160 430 q45-24 90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0" opacity=".55" />
        </g>

        <path d="M0 462 Q210 425 410 455 T820 448 1000 430 V500 H0Z" fill="#d4e6b2" />
        <rect y="480" width="1000" height="170" fill="url(#road)" />
        <g clip-path="url(#roadClip)" class="road-line motion" fill="#f8d98a" opacity=".9">
          <rect x="-120" y="555" width="125" height="11" rx="5" />
          <rect x="100" y="555" width="125" height="11" rx="5" />
          <rect x="320" y="555" width="125" height="11" rx="5" />
          <rect x="540" y="555" width="125" height="11" rx="5" />
          <rect x="760" y="555" width="125" height="11" rx="5" />
          <rect x="980" y="555" width="125" height="11" rx="5" />
        </g>

        <g class="spark motion" fill="#fff3b1">
          <path d="M173 283l5 14 14 5-14 5-5 14-5-14-14-5 14-5Z" />
          <path d="M850 316l4 11 11 4-11 4-4 11-4-11-11-4 11-4Z" />
          <path d="M910 235l3 9 9 3-9 3-3 9-3-9-9-3 9-3Z" />
        </g>

        <!-- The rider and bicycle share a tiny vertical bob to sell the motion. -->
        <g class="ride motion" filter="url(#softShadow)">
          <!-- bicycle -->
          <g stroke="#3f8fbe" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <circle class="wheel motion" cx="360" cy="493" r="83" />
            <circle class="wheel motion" cx="665" cy="493" r="83" />
            <path d="M360 493 L459 390 L563 493 L360 493 L523 493 L459 390 L440 493" />
            <path d="M563 493 L594 379 L637 360" />
            <path d="M594 379 L558 356" />
            <path d="M440 493 L414 423" />
            <path d="M414 423 L382 423" />
          </g>
          <g stroke="#bcecff" stroke-width="4" opacity=".8" fill="none">
            <circle cx="360" cy="493" r="72" />
            <circle cx="665" cy="493" r="72" />
            <path d="M360 493h83m-83 0 42-72m-42 72 42 72m-42-72-42-72m42 72-42 72" />
            <path d="M665 493h83m-83 0 42-72m-42 72 42 72m-42-72-42-72m42 72-42 72" />
          </g>
          <g transform="translate(523 493)">
            <g class="crank motion">
              <circle r="18" fill="#f7c763" stroke="#8f5f37" stroke-width="5" />
              <path d="M0 0l42 22M0 0l-33-28" stroke="#8f5f37" stroke-width="7" stroke-linecap="round" />
              <rect x="38" y="18" width="26" height="8" rx="4" fill="#ef8b59" transform="rotate(28 38 18)" />
              <rect x="-56" y="-35" width="26" height="8" rx="4" fill="#ef8b59" transform="rotate(28 -56 -35)" />
            </g>
          </g>

          <!-- legs and body -->
          <g stroke="#dc744f" stroke-width="14" fill="none" stroke-linecap="round">
            <path class="leg-front motion" d="M520 339 Q520 390 545 431" />
            <path class="leg-back motion" d="M493 341 Q470 391 503 432" />
          </g>
          <g fill="#f4a45f" stroke="#a75f45" stroke-width="4">
            <ellipse cx="548" cy="436" rx="27" ry="9" transform="rotate(16 548 436)" />
            <ellipse cx="501" cy="437" rx="27" ry="9" transform="rotate(-18 501 437)" />
          </g>

          <ellipse cx="503" cy="306" rx="91" ry="70" fill="#fff8e8" stroke="#a75f45" stroke-width="5" />
          <path d="M445 312 Q500 283 570 306" fill="none" stroke="#e7d6b8" stroke-width="7" stroke-linecap="round" />
          <g class="wing motion">
            <path d="M451 287 Q386 307 408 369 Q456 356 495 319Z" fill="#f2e5cf" stroke="#a75f45" stroke-width="5" />
            <path d="M429 321 Q455 316 477 303" fill="none" stroke="#d6bd9b" stroke-width="5" stroke-linecap="round" />
          </g>

          <!-- long neck and head -->
          <path d="M512 270 Q526 214 563 180" fill="none" stroke="#fff8e8" stroke-width="49" stroke-linecap="round" />
          <path d="M512 270 Q526 214 563 180" fill="none" stroke="#a75f45" stroke-width="5" stroke-linecap="round" opacity=".7" />
          <g class="head motion">
            <ellipse cx="586" cy="160" rx="51" ry="45" fill="#fff8e8" stroke="#a75f45" stroke-width="5" />
            <path d="M573 176 Q595 190 622 177" fill="none" stroke="#e8d4b5" stroke-width="6" stroke-linecap="round" />
            <path d="M614 163 Q700 168 716 197 Q659 218 600 185Z" fill="#f49b59" stroke="#a75f45" stroke-width="5" stroke-linejoin="round" />
            <path d="M691 194 Q715 199 730 192" fill="none" stroke="#b65e45" stroke-width="5" stroke-linecap="round" />
            <circle cx="601" cy="149" r="7" fill="#18324a" />
            <circle cx="603" cy="146" r="2.5" fill="#fff" />
            <path d="M548 128 Q580 90 626 119 L622 136 Q584 119 552 145Z" fill="#ffd15e" stroke="#a75f45" stroke-width="5" />
            <path d="M561 113 Q586 96 614 110" fill="none" stroke="#fff1af" stroke-width="5" stroke-linecap="round" />
          </g>
          <path d="M551 230 Q581 243 595 220" fill="none" stroke="#d9c29f" stroke-width="5" stroke-linecap="round" />
        </g>

        <g fill="#fff" opacity=".82" font-family="sans-serif">
          <text x="50" y="595" font-size="16" letter-spacing=".16em">SEABREEZE LOOP</text>
          <text x="50" y="620" font-size="12" opacity=".8">keep pedaling · keep smiling</text>
        </g>
      </svg>
    </section>

    <div class="legend" aria-hidden="true">
      <span><i class="dot orange"></i>鹈鹕轻轻点头</span>
      <span><i class="dot blue"></i>车轮持续转动</span>
      <span><i class="dot yellow"></i>海边风景向后掠过</span>
    </div>
  </main>

  <script>
    const scene = document.querySelector('.scene');
    const toggle = document.querySelector('#toggle');
    toggle.addEventListener('click', () => {
      const paused = scene.classList.toggle('paused');
      toggle.textContent = paused ? '继续动画' : '暂停动画';
      toggle.setAttribute('aria-pressed', String(paused));
    });
  </script>
</body>
</html>

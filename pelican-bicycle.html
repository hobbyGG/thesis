<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鹈鹕骑自行车</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17324d;
      --soft-ink: #42647f;
      --paper: #f4fbff;
      --sun: #ffd26a;
      --sky-top: #94d8f4;
      --sky-bottom: #e7f8ff;
      --water: #70c7db;
      --water-deep: #3fa7c2;
      --reed: #2c887c;
      --orange: #e98b36;
      --pelican: #f2eee4;
      --pelican-shade: #d6d1c3;
      --outline: #293c4d;
      --bike: #df5a4e;
      --bike-dark: #a94242;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
      background: #d9f1fa;
      font-family: ui-rounded, "SF Pro Rounded", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
    }

    .wrap {
      width: min(100%, 1000px);
    }

    .scene-shell {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(34, 80, 108, .16);
      border-radius: 28px;
      background: var(--paper);
      box-shadow: 0 20px 50px rgba(30, 91, 117, .18), 0 3px 8px rgba(30, 91, 117, .08);
    }

    .scene-shell::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.55);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .caption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 18px 15px;
      background: rgba(255,255,255,.72);
      border-top: 1px solid rgba(34, 80, 108, .1);
      font-size: 14px;
      color: var(--soft-ink);
    }

    .caption strong {
      color: var(--ink);
      font-weight: 700;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      background: var(--bike);
      cursor: pointer;
      transition: transform .16s ease, background .16s ease, box-shadow .16s ease;
      box-shadow: 0 3px 8px rgba(169,66,66,.2);
    }

    button:hover { background: var(--bike-dark); transform: translateY(-1px); }
    button:focus-visible { outline: 3px solid rgba(66, 158, 192, .45); outline-offset: 3px; }

    .cloud { animation: cloud-drift 22s linear infinite; }
    .cloud.cloud-slow { animation-duration: 34s; animation-delay: -12s; }
    .water-line { animation: water-shimmer 4s ease-in-out infinite; }
    .water-line.delay-1 { animation-delay: -1.3s; }
    .water-line.delay-2 { animation-delay: -2.6s; }
    .sun-glow { animation: sun-breathe 4s ease-in-out infinite; transform-origin: 800px 105px; }
    .bike-wheel { animation: wheel-spin 1.55s linear infinite; transform-box: fill-box; }
    .rider { animation: rider-bob .78s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
    .wing { animation: wing-flap .78s ease-in-out infinite; transform-box: fill-box; transform-origin: 478px 228px; }
    .pedal-cycle { animation: pedal-turn 1.55s linear infinite; transform-box: view-box; transform-origin: 458px 400px; }
    .tail-feather { animation: tail-flick 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: right center; }
    .bird { animation: bird-glide 8s ease-in-out infinite; }
    .bird.bird-2 { animation-delay: -3.6s; animation-duration: 10s; }
    .reed-sway { animation: reed-sway 2.8s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom center; }
    .reed-sway.delay-1 { animation-delay: -.9s; }
    .reed-sway.delay-2 { animation-delay: -1.7s; }
    .bubble { animation: bubble-rise 5s ease-in infinite; }
    .bubble.b2 { animation-delay: -2.1s; animation-duration: 6.5s; }
    .bubble.b3 { animation-delay: -3.4s; animation-duration: 4.3s; }

    .is-paused *, .is-paused *::before, .is-paused *::after { animation-play-state: paused !important; }

    @keyframes cloud-drift {
      from { transform: translateX(-120px); }
      to { transform: translateX(120px); }
    }
    @keyframes water-shimmer {
      0%, 100% { opacity: .28; transform: translateX(0); }
      50% { opacity: .72; transform: translateX(12px); }
    }
    @keyframes sun-breathe {
      0%, 100% { transform: scale(.98); opacity: .8; }
      50% { transform: scale(1.06); opacity: 1; }
    }
    @keyframes wheel-spin { to { transform: rotate(360deg); } }
    @keyframes rider-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(4px); }
    }
    @keyframes wing-flap {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-8deg) translateY(-3px); }
    }
    @keyframes pedal-turn { to { transform: rotate(360deg); } }
    @keyframes tail-flick {
      0%, 80%, 100% { transform: rotate(0deg); }
      88% { transform: rotate(-5deg); }
    }
    @keyframes bird-glide {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(22px, -8px); }
    }
    @keyframes reed-sway {
      from { transform: rotate(-2deg); }
      to { transform: rotate(4deg); }
    }
    @keyframes bubble-rise {
      0% { transform: translateY(14px); opacity: 0; }
      20% { opacity: .75; }
      100% { transform: translateY(-42px); opacity: 0; }
    }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .scene-shell { border-radius: 20px; }
      .caption { font-size: 12px; padding: 10px 13px 12px; }
      button { padding: 7px 11px; font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="scene-shell" id="scene" aria-label="一只鹈鹕正在湖边骑自行车的动画">
      <svg viewBox="0 0 960 560" role="img" aria-labelledby="scene-title scene-desc">
        <title id="scene-title">鹈鹕骑自行车</title>
        <desc id="scene-desc">一只戴着蓝色小帽子的鹈鹕沿着湖边骑红色自行车，车轮、翅膀、脚踏和云朵都在缓慢运动。</desc>
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8dd5f2" />
            <stop offset="1" stop-color="#e9f9ff" />
          </linearGradient>
          <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#75cddd" />
            <stop offset="1" stop-color="#49a9c3" />
          </linearGradient>
          <linearGradient id="hill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#74bd9c" />
            <stop offset="1" stop-color="#469681" />
          </linearGradient>
          <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="7" />
            <feOffset dy="7" />
            <feComponentTransfer><feFuncA type="linear" slope=".2" /></feComponentTransfer>
            <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
          <filter id="tiny-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
            <feOffset dy="2" />
            <feComponentTransfer><feFuncA type="linear" slope=".23" /></feComponentTransfer>
            <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        </defs>

        <rect width="960" height="560" fill="url(#sky)" />
        <g class="sun-glow">
          <circle cx="800" cy="105" r="62" fill="#ffe8a0" opacity=".32" />
          <circle cx="800" cy="105" r="38" fill="#ffd26a" />
          <circle cx="788" cy="94" r="8" fill="#ffe8a0" opacity=".7" />
        </g>

        <g class="cloud" fill="#fff" opacity=".78">
          <path d="M90 127c-21 0-37-13-37-30s16-31 37-31c8-22 30-36 55-36 28 0 51 17 57 42 5-2 11-3 17-3 22 0 40 13 40 29s-18 29-40 29H90Z" />
        </g>
        <g class="cloud cloud-slow" fill="#fff" opacity=".52">
          <path d="M641 63c-17 0-31-11-31-25s14-25 31-25c7-18 24-28 44-28 22 0 40 13 45 32 5-2 9-2 14-2 18 0 32 10 32 24s-14 24-32 24H641Z" />
        </g>

        <path d="M0 298C121 247 220 257 321 292c117 41 191-10 286-33 111-27 219-7 353 49v107H0Z" fill="url(#hill)" opacity=".78" />
        <path d="M0 339c112-26 208-12 312 21 126 39 202-17 311-35 114-19 229 5 337 52v73H0Z" fill="#5aa990" opacity=".72" />
        <rect y="356" width="960" height="204" fill="url(#water)" />
        <path d="M0 365c126-15 228-14 344 4 124 19 215 17 339-1 114-17 182-14 277 2" fill="none" stroke="#b4edf0" stroke-width="7" opacity=".45" />
        <path class="water-line" d="M60 431c95-16 169-12 260 2s167 16 257 1 169-15 266 0" fill="none" stroke="#bdeff2" stroke-width="6" stroke-linecap="round" opacity=".55" />
        <path class="water-line delay-1" d="M134 482c71-11 127-9 195 1s133 12 205 1 134-13 214 0" fill="none" stroke="#bdeff2" stroke-width="4" stroke-linecap="round" opacity=".48" />
        <path class="water-line delay-2" d="M580 526c59-8 105-7 160 1s102 8 158-1" fill="none" stroke="#bdeff2" stroke-width="5" stroke-linecap="round" opacity=".5" />

        <g class="bird bird-1" fill="none" stroke="#3d6b7e" stroke-width="4" stroke-linecap="round">
          <path d="M167 179c15-12 29-12 43 0-14-5-28-5-43 0Z" />
        </g>
        <g class="bird bird-2" fill="none" stroke="#3d6b7e" stroke-width="3.5" stroke-linecap="round">
          <path d="M731 208c12-10 24-10 36 0-12-4-24-4-36 0Z" />
        </g>

        <g class="reed-sway" fill="none" stroke="#2c887c" stroke-linecap="round">
          <path d="M78 560c5-73 3-107-8-155" stroke-width="9" />
          <path d="M79 486c-21-24-31-36-38-62M78 456c23-21 31-31 39-53" stroke-width="6" />
        </g>
        <g class="reed-sway delay-1" fill="none" stroke="#338e7e" stroke-linecap="round">
          <path d="M112 560c-3-64 2-103 21-152" stroke-width="8" />
          <path d="M119 483c-18-18-26-34-29-53M126 450c19-18 28-35 32-56" stroke-width="5" />
        </g>
        <g class="reed-sway delay-2" fill="none" stroke="#2a7f77" stroke-linecap="round">
          <path d="M885 560c-4-75 4-109 17-160" stroke-width="9" />
          <path d="M894 476c-18-24-24-43-25-65M901 447c22-19 30-37 35-62" stroke-width="6" />
        </g>

        <ellipse cx="468" cy="482" rx="235" ry="22" fill="#226f83" opacity=".22" />

        <!-- bicycle -->
        <g filter="url(#soft-shadow)" stroke-linecap="round" stroke-linejoin="round">
          <g class="bike-wheel" fill="none" stroke="#274758">
            <circle cx="350" cy="400" r="78" stroke-width="7" />
            <circle cx="350" cy="400" r="8" fill="#df5a4e" stroke-width="5" />
            <path d="M350 329v142M279 400h142M300 350l100 100M400 350 300 450" stroke-width="2" opacity=".52" />
          </g>
          <g class="bike-wheel" fill="none" stroke="#274758">
            <circle cx="565" cy="400" r="78" stroke-width="7" />
            <circle cx="565" cy="400" r="8" fill="#df5a4e" stroke-width="5" />
            <path d="M565 329v142M494 400h142M515 350l100 100M615 350 515 450" stroke-width="2" opacity=".52" />
          </g>
          <g fill="none" stroke="#df5a4e" stroke-width="11">
            <path d="M350 400h108l-48-111Z" />
            <path d="M410 289 565 400M458 400 410 289" />
          </g>
          <path d="M395 284h39" stroke="#274758" stroke-width="9" />
          <path d="M410 289 405 274" stroke="#274758" stroke-width="8" />
          <path d="M562 324c-14-31-11-44 4-54" fill="none" stroke="#274758" stroke-width="8" />
          <path d="M561 270h39" stroke="#274758" stroke-width="8" />
          <circle cx="458" cy="400" r="19" fill="#f1b14b" stroke="#274758" stroke-width="6" />
          <path d="M458 400 490 378M458 400 430 427" stroke="#274758" stroke-width="7" />
          <path d="M486 378h22M425 430h-22" stroke="#274758" stroke-width="7" />
          <path d="M380 279h-26" stroke="#274758" stroke-width="9" />
          <path d="M356 279v14" stroke="#274758" stroke-width="7" />
        </g>

        <!-- rider -->
        <g class="rider" filter="url(#tiny-shadow)">
          <g class="tail-feather">
            <path d="M401 270c-35 5-58 27-75 42 33 6 58 1 80-17Z" fill="#d8d1c2" stroke="#293c4d" stroke-width="4" stroke-linejoin="round" />
            <path d="M393 281c-21 8-35 16-47 26" fill="none" stroke="#a9a294" stroke-width="3" stroke-linecap="round" />
          </g>
          <ellipse cx="439" cy="273" rx="64" ry="76" fill="#f2eee4" stroke="#293c4d" stroke-width="5" />
          <path d="M397 262c8-37 27-64 54-67 23-2 37 17 39 47-22 18-57 29-93 20Z" fill="#f6f1e7" stroke="#293c4d" stroke-width="5" />
          <path d="M445 198c-11-13-9-31 7-44 12-9 28-8 39 4 10 12 10 31-2 43-11 12-30 13-44-3Z" fill="#f2eee4" stroke="#293c4d" stroke-width="5" />
          <path d="M462 165c-4-16 3-26 16-29 16-4 28 6 30 20 1 10-3 18-11 24Z" fill="#4c94b5" stroke="#293c4d" stroke-width="4" />
          <path d="M503 199c24 1 51 12 75 29-24 12-51 12-76 1Z" fill="#e99756" stroke="#293c4d" stroke-width="5" stroke-linejoin="round" />
          <path d="M505 214c23 3 44 8 61 14-20 4-41 2-61-3Z" fill="#f6c47e" opacity=".9" />
          <circle cx="485" cy="188" r="6" fill="#293c4d" />
          <circle cx="487" cy="186" r="2" fill="#fff" />
          <path d="M425 215c-13 22-13 42-2 60" fill="none" stroke="#d1c9ba" stroke-width="7" stroke-linecap="round" />
          <g class="wing">
            <path d="M405 230c-20 12-34 35-35 62 2 22 17 39 35 44 23-20 36-56 32-86-4-19-14-27-32-20Z" fill="#d6d1c3" stroke="#293c4d" stroke-width="5" />
            <path d="M395 251c-8 18-10 37-5 56M407 247c-4 23-3 44 3 64M419 246c0 25 4 42 10 56" fill="none" stroke="#aaa496" stroke-width="3" stroke-linecap="round" />
          </g>
          <path d="M407 334c11 9 23 15 35 17" fill="none" stroke="#293c4d" stroke-width="8" stroke-linecap="round" />
          <path d="M443 351c2 16 0 31-5 48M446 351c16 12 27 22 34 35" fill="none" stroke="#e99756" stroke-width="9" stroke-linecap="round" />
          <path d="M434 398h-18M480 386h17" fill="none" stroke="#293c4d" stroke-width="6" stroke-linecap="round" />
        </g>

        <!-- moving pedals and feet -->
        <g class="pedal-cycle" fill="none" stroke="#e99756" stroke-width="8" stroke-linecap="round">
          <path d="M444 350c-4 16-5 33 5 50" />
          <path d="M468 347c9 16 17 28 34 39" />
          <path d="M449 400h-24M502 386h23" stroke="#293c4d" stroke-width="6" />
        </g>

        <g class="bubble" opacity=".65">
          <circle cx="245" cy="437" r="6" fill="none" stroke="#d7f8f6" stroke-width="3" />
        </g>
        <g class="bubble b2" opacity=".65">
          <circle cx="670" cy="477" r="5" fill="none" stroke="#d7f8f6" stroke-width="3" />
        </g>
        <g class="bubble b3" opacity=".65">
          <circle cx="733" cy="420" r="4" fill="none" stroke="#d7f8f6" stroke-width="2.5" />
        </g>
      </svg>
      <div class="caption">
        <span><strong>湖边巡游</strong> · 鹈鹕今天也在练车</span>
        <button id="toggle" type="button" aria-pressed="false">暂停动画</button>
      </div>
    </section>
  </main>
  <script>
    const scene = document.getElementById('scene');
    const toggle = document.getElementById('toggle');
    toggle.addEventListener('click', () => {
      const paused = scene.classList.toggle('is-paused');
      toggle.setAttribute('aria-pressed', String(paused));
      toggle.textContent = paused ? '继续动画' : '暂停动画';
    });
  </script>
</body>
</html>

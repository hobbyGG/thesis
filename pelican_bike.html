<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pelican on a Bicycle</title>
<style>
  :root {
    color-scheme: light;
    --ink: #12324a;
    --water: #a9e4f5;
    --road: #2f526b;
    --road-line: #b8e5e9;
    --frame: #176b88;
    --frame-light: #54b3c2;
    --feather: #fffdf4;
    --feather-shadow: #d9e5e5;
    --wing: #78929c;
    --bill: #f39a4b;
    --bill-dark: #d56e31;
    --foot: #ec8736;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    display: grid;
    place-items: center;
    padding: 1rem;
    background: #16445e;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .scene {
    position: relative;
    width: min(1100px, 96vw);
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border: 4px solid rgba(255, 255, 255, .78);
    border-radius: 1.35rem;
    box-shadow: 0 1rem 3.4rem rgba(0, 0, 0, .3);
    background: var(--water);
  }
  svg { display: block; width: 100%; height: 100%; }

  /* The world has a gentle drift so the bird feels like it is travelling. */
  .cloud { animation: cloud-drift 18s linear infinite; }
  .cloud.slow { animation-duration: 27s; animation-delay: -9s; }
  .road-dash { animation: road-roll 1.2s linear infinite; }
  .bird { animation: bird-bob 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .wing { animation: wing-flap 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 14% 55%; }
  .wheel-spin { animation: wheel-spin 1.15s linear infinite; transform-box: fill-box; transform-origin: center; }
  .pedal-spin { animation: pedal-spin 1.15s linear infinite; transform-box: view-box; transform-origin: 530px 500px; }
  .leg { animation: leg-pedal 1.15s linear infinite; transform-box: view-box; transform-origin: 530px 500px; }
  .leg.back { animation-delay: -.575s; }

  .caption {
    position: absolute;
    left: 1.1rem;
    bottom: .8rem;
    margin: 0;
    padding: .38rem .75rem;
    border-radius: 999px;
    color: #eafaff;
    background: rgba(11, 47, 66, .6);
    font-size: clamp(.72rem, 1.3vw, .9rem);
    letter-spacing: .03em;
    backdrop-filter: blur(4px);
  }
  .hint {
    position: absolute;
    right: 1.1rem;
    bottom: .8rem;
    margin: 0;
    color: rgba(234, 250, 255, .82);
    font-size: clamp(.67rem, 1.2vw, .82rem);
  }

  @keyframes wheel-spin { to { transform: rotate(360deg); } }
  @keyframes pedal-spin { to { transform: rotate(360deg); } }
  @keyframes leg-pedal { to { transform: rotate(360deg); } }
  @keyframes bird-bob {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-7px) rotate(1deg); }
  }
  @keyframes wing-flap {
    0%, 100% { transform: rotate(2deg) scaleY(1); }
    50% { transform: rotate(-8deg) scaleY(.92); }
  }
  @keyframes road-roll { to { transform: translateX(-160px); } }
  @keyframes cloud-drift { from { transform: translateX(-210px); } to { transform: translateX(1150px); } }

  @media (prefers-reduced-motion: reduce) {
    .cloud, .road-dash, .bird, .wing, .wheel-spin, .pedal-spin, .leg { animation-play-state: paused; }
  }
</style>
</head>
<body>
  <main class="scene" aria-label="A cheerful pelican riding a bicycle">
    <svg viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
      <title id="title">A pelican riding a bicycle</title>
      <desc id="desc">A friendly pelican with a long orange bill pedals a blue bicycle along a seaside road.</desc>
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#78d1ec" />
          <stop offset=".62" stop-color="#c7f2f8" />
          <stop offset="1" stop-color="#e9f8e7" />
        </linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#55bdcc" />
          <stop offset="1" stop-color="#1c829f" />
        </linearGradient>
        <linearGradient id="feather" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff" />
          <stop offset="1" stop-color="#e0ebeb" />
        </linearGradient>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="160%">
          <feGaussianBlur stdDeviation="7" />
        </filter>
        <clipPath id="road-clip"><rect x="0" y="545" width="1200" height="130" rx="0" /></clipPath>
      </defs>

      <!-- Sky and distant layers -->
      <rect width="1200" height="675" fill="url(#sky)" />
      <g class="cloud" fill="#fff" opacity=".78">
        <path d="M82 140c9-34 58-44 80-13 22-41 93-30 98 19 41-8 68 16 68 43H48c-4-25 8-44 34-49z" />
      </g>
      <g class="cloud slow" fill="#fff" opacity=".62">
        <path d="M820 95c10-26 44-34 66-12 22-33 79-23 82 19 30-6 51 13 53 34H791c1-20 10-34 29-41z" />
      </g>
      <g opacity=".34" fill="#fff">
        <path d="M0 357c130-32 230-36 366 0s234 40 390 0 290-36 444 0v105H0z" />
      </g>
      <path d="M0 433c135-40 253-42 378 0s238 38 372 0 282-41 450 1v130H0z" fill="url(#sea)" opacity=".9" />
      <path d="M0 487c140-25 239-27 365 2s254 27 394-1 287-26 441 3v55H0z" fill="#5fc2cb" opacity=".72" />
      <path d="M0 535h1200v140H0z" fill="#32586b" />
      <path d="M0 545h1200v8H0z" fill="#d8cda8" opacity=".8" />
      <g class="road-dash" clip-path="url(#road-clip)" stroke="#c3e6e6" stroke-width="8" stroke-linecap="round" opacity=".85">
        <path d="M-80 613h110" /><path d="M120 613h110" /><path d="M320 613h110" /><path d="M520 613h110" /><path d="M720 613h110" /><path d="M920 613h110" /><path d="M1120 613h110" />
      </g>
      <ellipse cx="563" cy="594" rx="312" ry="27" fill="#163c50" opacity=".32" filter="url(#soft-shadow)" />

      <!-- Bicycle -->
      <g id="bicycle" stroke-linecap="round" stroke-linejoin="round">
        <g fill="none" stroke="#e6f5f5" stroke-width="14" opacity=".72">
          <circle cx="397" cy="489" r="106" /><circle cx="716" cy="489" r="106" />
        </g>
        <g class="wheel-spin" fill="none" stroke="#183a4f" stroke-width="7">
          <circle cx="397" cy="489" r="106" />
          <g stroke="#6e9ba7" stroke-width="3" opacity=".85">
            <path d="M397 383v212M291 489h212M322 414l150 150M472 414L322 564" />
          </g>
          <circle cx="397" cy="489" r="9" fill="#f0a34e" stroke="none" />
        </g>
        <g class="wheel-spin" fill="none" stroke="#183a4f" stroke-width="7">
          <circle cx="716" cy="489" r="106" />
          <g stroke="#6e9ba7" stroke-width="3" opacity=".85">
            <path d="M716 383v212M610 489h212M641 414l150 150M791 414L641 564" />
          </g>
          <circle cx="716" cy="489" r="9" fill="#f0a34e" stroke="none" />
        </g>
        <g fill="none" stroke="var(--frame)" stroke-width="14">
          <path d="M397 489L493 382L577 489L397 489L530 500L493 382" />
          <path d="M577 489L716 489L674 366L577 489" />
          <path d="M674 366l38-28" />
        </g>
        <path d="M697 334l42-5" fill="none" stroke="#173d51" stroke-width="11" />
        <path d="M480 373l34-11" fill="none" stroke="#173d51" stroke-width="11" />
        <path d="M465 363h49" fill="none" stroke="#cf6f4c" stroke-width="13" />
        <circle cx="530" cy="500" r="19" fill="#f6ac46" stroke="#163a4b" stroke-width="6" />
        <g class="pedal-spin" stroke="#163a4b" stroke-width="6">
          <path d="M530 500l32-25" /><path d="M530 500l-34 27" />
          <path d="M556 473h27" /><path d="M469 532h27" />
        </g>
        <g fill="#173d51">
          <circle cx="397" cy="489" r="12" /><circle cx="716" cy="489" r="12" />
        </g>
      </g>

      <!-- Pelican, bobbing with each pedal stroke -->
      <g class="bird" id="pelican">
        <!-- trailing tail feathers -->
        <path d="M408 318c-42 22-73 52-91 85 44-9 81-25 111-49z" fill="url(#feather)" stroke="#4a6974" stroke-width="5" />
        <path d="M408 327c-38 33-56 57-64 75 35-17 60-34 81-55z" fill="#b6cdd1" opacity=".8" />
        <!-- body -->
        <ellipse cx="493" cy="268" rx="113" ry="86" fill="url(#feather)" stroke="#4a6974" stroke-width="6" />
        <path d="M408 281c29 49 110 70 162 22 20-19 30-39 32-60-29 48-76 64-122 55-31-6-53-18-72-38z" fill="#cbdcde" opacity=".84" />
        <!-- neck and head -->
        <path d="M535 224c-20-32-9-81 24-101 30-18 73-2 84 32 9 28-5 56-27 72-18 13-45 18-81-3z" fill="url(#feather)" stroke="#4a6974" stroke-width="6" />
        <path d="M559 118c-4-30 13-60 40-69 34-11 66 12 71 44 6 39-30 66-65 63-19-2-37-15-46-38z" fill="url(#feather)" stroke="#4a6974" stroke-width="6" />
        <!-- long bill -->
        <path d="M636 133c68 5 135 24 194 58-35 28-78 34-132 17-28-9-48-22-69-42z" fill="var(--bill)" stroke="#9d542b" stroke-width="6" />
        <path d="M636 133c74 12 130 32 194 58-53 1-106-12-160-36z" fill="#ffc16d" opacity=".68" />
        <path d="M637 159c52 31 117 43 174 32-36 22-83 29-130 16-22-6-38-17-49-28z" fill="var(--bill-dark)" opacity=".72" />
        <!-- eye and cheek -->
        <circle cx="638" cy="99" r="13" fill="#fff" stroke="#234555" stroke-width="4" />
        <circle cx="641" cy="100" r="6" fill="#1c2f3b" />
        <circle cx="644" cy="97" r="2.7" fill="#fff" />
        <path d="M609 117c17 16 33 18 47 11" fill="none" stroke="#e5aeb3" stroke-width="12" opacity=".65" />
        <!-- wing -->
        <g class="wing">
          <path d="M468 210c-53 21-79 80-40 128 33 40 98 13 126-29 26-39 2-83-86-99z" fill="var(--wing)" stroke="#4a6974" stroke-width="6" />
          <path d="M447 249c30 15 61 15 96-2M443 276c31 12 58 10 85-4M453 302c25 8 47 5 69-7" fill="none" stroke="#bcd0d2" stroke-width="7" opacity=".75" />
        </g>
        <!-- belly bib -->
        <path d="M509 234c-33 43-24 99 28 121 32 14 64 5 86-14-31 4-53-12-62-38-10-28-8-50 2-70z" fill="#f8dfbf" opacity=".82" />

        <!-- legs, rotating around the crank -->
        <g class="leg front" fill="none" stroke="#d67331" stroke-width="11">
          <path d="M514 333c11 41 12 93 16 167" />
          <path d="M530 500l31-25" />
        </g>
        <g class="leg back" fill="none" stroke="#b95e2c" stroke-width="10" opacity=".92">
          <path d="M548 327c-4 48-19 87-19 173" />
          <path d="M529 500l-34 27" />
        </g>
        <g fill="var(--foot)" stroke="#9d542b" stroke-width="4">
          <path d="M545 475l37-2c9 0 15 5 15 11s-7 10-16 9l-38-5z" />
          <path d="M493 522l-35 3c-10 1-16 6-15 12 1 6 9 9 18 7l36-9z" />
        </g>
      </g>

      <!-- a little motion sparkle -->
      <g fill="#fff6ad" opacity=".9">
        <circle cx="1023" cy="216" r="5"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite" /></circle>
        <circle cx="1050" cy="245" r="3"><animate attributeName="opacity" values="1;.2;1" dur="1.3s" repeatCount="indefinite" /></circle>
      </g>
    </svg>
    <p class="caption">Pelican Pedal Club</p>
    <p class="hint">⟳ looping ride</p>
  </main>
</body>
</html>
